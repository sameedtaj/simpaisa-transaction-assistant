services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: simpaisa-backend
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: simpaisa-frontend
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
